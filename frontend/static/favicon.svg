<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea582c"/>
      <stop offset="50%" stop-color="#b8381a"/>
      <stop offset="100%" stop-color="#641606"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Orange Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="130" fill="url(#bg)"/>
  <!-- Dark Security Shield -->
  <path d="M 256 95 L 395 145 V 275 C 395 365 330 415 256 440 C 182 415 117 365 117 275 V 145 Z" 
        fill="#10121a" stroke="#ca3e1c" stroke-width="6" filter="url(#shadow)"/>
  <!-- Tilted Orbital Ring -->
  <ellipse cx="256" cy="275" rx="195" ry="68" transform="rotate(-26 256 275)" 
           fill="none" stroke="#f6d3c6" stroke-width="32" stroke-linecap="round"/>
  <!-- White Satellite Node -->
  <circle cx="410" cy="170" r="34" fill="#ffffff" filter="url(#shadow)"/>
</svg>
